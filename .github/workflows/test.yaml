name: "CI - Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  detect-features:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list-features.outputs.features }}
    steps:
      - uses: actions/checkout@v5

      - name: "List features under ./src"
        id: list-features
        run: |
          set -euo pipefail
          features="$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "features=${features}" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: detect-features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-features.outputs.features) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
        # claude は Node.js が入っているイメージを前提にする（Node の導入に時間がかかるため）
        exclude:
          - feature: claude
        include:
          - feature: claude
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    steps:
      - uses: actions/checkout@v5

      # opencode / my-setup / claude Feature は ${localEnv:HOME}/... を bind mount するため、
      # マウント元ディレクトリを CI ランナーにも用意する
      - name: "Create host directories for mount tests"
        run: |
          mkdir -p "$HOME/.config/opencode"
          mkdir -p "$HOME/.local/share/opencode"
          mkdir -p "$HOME/.local/state/opencode"
          mkdir -p "$HOME/.config/gh"
          mkdir -p "$HOME/.claude"

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    needs: detect-features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-features.outputs.features) }}
    steps:
      - uses: actions/checkout@v5

      # opencode / my-setup / claude Feature は ${localEnv:HOME}/... を bind mount するため、
      # マウント元ディレクトリを CI ランナーにも用意する
      - name: "Create host directories for mount tests"
        run: |
          mkdir -p "$HOME/.config/opencode"
          mkdir -p "$HOME/.local/share/opencode"
          mkdir -p "$HOME/.local/state/opencode"
          mkdir -p "$HOME/.config/gh"
          mkdir -p "$HOME/.claude"

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.feature }}' scenarios"
        run: devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
