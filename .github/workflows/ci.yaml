name: "CI - Validate & Test Features"

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/ci.yaml"
  # release.yaml から公開前のゲートとして呼ばれる
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  detect-features:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list-features.outputs.features }}
    steps:
      - uses: actions/checkout@v5

      - name: "List features under ./src"
        id: list-features
        run: |
          set -euo pipefail
          features="$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "features=${features}" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: detect-features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-features.outputs.features) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v5

      # my-setup Feature は ${localEnv:MY_DEVCONTAINER_DATA_DIR}/... を bind mount するため、
      # マウント元ディレクトリを CI ランナーにも用意する
      - name: "Create host directories for mount tests"
        run: |
          echo "MY_DEVCONTAINER_DATA_DIR=$HOME/devcontainer-data" >> "$GITHUB_ENV"
          mkdir -p "$HOME"/devcontainer-data/{gh,zsh-history,claude,opencode/{config,data,state}}
          # コンテナ内のユーザー(vscode など)がランナーと別 UID でも書き込めるようにする
          chmod -R a+rwX "$HOME/devcontainer-data"

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    needs: detect-features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-features.outputs.features) }}
    steps:
      - uses: actions/checkout@v5

      # my-setup Feature は ${localEnv:MY_DEVCONTAINER_DATA_DIR}/... を bind mount するため、
      # マウント元ディレクトリを CI ランナーにも用意する
      - name: "Create host directories for mount tests"
        run: |
          echo "MY_DEVCONTAINER_DATA_DIR=$HOME/devcontainer-data" >> "$GITHUB_ENV"
          mkdir -p "$HOME"/devcontainer-data/{gh,zsh-history,claude,opencode/{config,data,state}}
          # コンテナ内のユーザー(vscode など)がランナーと別 UID でも書き込めるようにする
          chmod -R a+rwX "$HOME/devcontainer-data"

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.feature }}' scenarios"
        run: |
          scenarios="test/${{ matrix.feature }}/scenarios.json"
          if [ ! -f "${scenarios}" ]; then
            devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated .
            exit 0
          fi
          # シナリオ間でホスト側の bind mount 元を共有すると、前のシナリオ(root)が作った
          # ファイルを次のシナリオ(vscode など)が開けず失敗するため、1 つずつ作り直して実行する
          for scenario in $(jq -r 'keys[]' "${scenarios}"); do
            sudo rm -rf "${MY_DEVCONTAINER_DATA_DIR}"
            mkdir -p "${MY_DEVCONTAINER_DATA_DIR}"/{gh,zsh-history,claude,opencode/{config,data,state}}
            chmod -R a+rwX "${MY_DEVCONTAINER_DATA_DIR}"
            devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated --filter "${scenario}" .
          done

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # my-setup Feature は ${localEnv:MY_DEVCONTAINER_DATA_DIR}/... を bind mount するため、
      # マウント元ディレクトリを CI ランナーにも用意する
      - name: "Create host directories for mount tests"
        run: |
          echo "MY_DEVCONTAINER_DATA_DIR=$HOME/devcontainer-data" >> "$GITHUB_ENV"
          mkdir -p "$HOME"/devcontainer-data/{gh,zsh-history,claude,opencode/{config,data,state}}
          # コンテナ内のユーザー(vscode など)がランナーと別 UID でも書き込めるようにする
          chmod -R a+rwX "$HOME/devcontainer-data"

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
